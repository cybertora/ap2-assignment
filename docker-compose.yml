version: "3.9"

services:
  # ─── Databases ─────────────────────────────────────────────────────
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
      - ./order-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
      - ./payment-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Payment Service (gRPC Server + REST) ──────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8081:8081"    # REST (GET /payments/:order_id)
      - "50051:50051"  # gRPC (ProcessPayment)
    environment:
      DB_HOST: payment-db
      DB_PORT: "5432"
      DB_USER: payment_user
      DB_PASSWORD: payment_pass
      DB_NAME: payment_db
      DB_SSLMODE: disable
      SERVER_PORT: "8081"
      GRPC_PORT: "50051"
    depends_on:
      payment-db:
        condition: service_healthy
    restart: on-failure

  # ─── Order Service (REST + gRPC Client → Payment + gRPC Server Streaming) ──
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"    # REST (POST /orders, GET /orders/:id, etc.)
      - "50052:50052"  # gRPC (SubscribeToOrderUpdates streaming)
    environment:
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_USER: order_user
      DB_PASSWORD: order_pass
      DB_NAME: order_db
      DB_SSLMODE: disable
      SERVER_PORT: "8080"
      PAYMENT_GRPC_ADDR: "payment-service:50051"
      GRPC_PORT: "50052"
    depends_on:
      order-db:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: on-failure

volumes:
  order-data:
  payment-data:
