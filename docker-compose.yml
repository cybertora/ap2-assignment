version: "3.9"

services:
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
      - ./order-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
      - ./payment-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      DB_HOST: payment-db
      DB_PORT: "5432"
      DB_USER: payment_user
      DB_PASSWORD: payment_pass
      DB_NAME: payment_db
      DB_SSLMODE: disable
      SERVER_PORT: "8081"
      GRPC_PORT: "50051"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EVENTS_EXCHANGE: payments.events
      PAYMENT_EVENTS_ROUTING_KEY: payment.processed
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
      - "50052:50052"
    environment:
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_USER: order_user
      DB_PASSWORD: order_pass
      DB_NAME: order_db
      DB_SSLMODE: disable
      SERVER_PORT: "8080"
      PAYMENT_GRPC_ADDR: "payment-service:50051"
      GRPC_PORT: "50052"
    depends_on:
      order-db:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: on-failure

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EVENTS_EXCHANGE: payments.events
      PAYMENT_EVENTS_ROUTING_KEY: payment.processed
      PAYMENT_DLX_EXCHANGE: payments.dlx
      PAYMENT_QUEUE: notification.payment.processed
      PAYMENT_DLQ: notification.payment.processed.dlq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  order-data:
  payment-data:
