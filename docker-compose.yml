version: "3.9"

services:
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
      - ./order-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
      - ./payment-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # === NEW: Redis для кэширования, идемпотентности и rate limit ===
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      DB_HOST: payment-db
      DB_PORT: "5432"
      DB_USER: payment_user
      DB_PASSWORD: payment_pass
      DB_NAME: payment_db
      DB_SSLMODE: disable
      SERVER_PORT: "8081"
      GRPC_PORT: "50051"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EVENTS_EXCHANGE: payments.events
      PAYMENT_EVENTS_ROUTING_KEY: payment.processed
    depends_on:
      payment-db: { condition: service_healthy }
      rabbitmq:   { condition: service_healthy }
    restart: on-failure

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
      - "50052:50052"
    environment:
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_USER: order_user
      DB_PASSWORD: order_pass
      DB_NAME: order_db
      DB_SSLMODE: disable
      SERVER_PORT: "8080"
      PAYMENT_GRPC_ADDR: "payment-service:50051"
      GRPC_PORT: "50052"
      # === NEW ===
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CACHE_TTL_SECONDS: "300"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPM: "10"
    depends_on:
      order-db:        { condition: service_healthy }
      payment-service: { condition: service_started }
      redis:           { condition: service_healthy }
    restart: on-failure

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EVENTS_EXCHANGE: payments.events
      PAYMENT_EVENTS_ROUTING_KEY: payment.processed
      PAYMENT_DLX_EXCHANGE: payments.dlx
      PAYMENT_QUEUE: notification.payment.processed
      PAYMENT_DLQ: notification.payment.processed.dlq
      # === NEW ===
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "1"
      IDEMPOTENCY_TTL_HOURS: "24"
      PROVIDER_MODE: "SIMULATED"        # REAL | SIMULATED
      SMTP_HOST: "smtp.mailtrap.io"
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: "no-reply@shop.local"
      RETRY_MAX_ATTEMPTS: "5"
      RETRY_BASE_DELAY_MS: "2000"
      WORKER_POOL_SIZE: "4"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure

volumes:
  order-data:
  payment-data:
  redis-data:
